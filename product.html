<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | North Shore</title>
  <meta name="description" content="">
  <link rel="icon" href="assets/favicon.png" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#0A0A0C">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
  <div class="container product" id="product"></div>
  <section class="section section--tight" style="background:#fff;border-top:1px solid var(--line)">
    <div class="container">
      <div class="section-head"><span class="eyebrow">You might also like</span><h2 class="mb-0">Related products</h2></div>
      <div class="grid grid--4" id="related"></div>
    </div>
  </section>
</main>

<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/discounts.js"></script>
<script src="js/cart.js"></script><script src="js/cookies.js"></script><script src="js/main.js"></script><script src="js/coa.js"></script>
<script src="js/age-gate.js"></script><script src="js/offer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const id = new URLSearchParams(location.search).get("id");
  const p = PRODUCTS.find(x => x.id === id) || PRODUCTS[0];
  const root = document.getElementById("product");
  const I = UI.icons;
  const coas = (window.COAS || []).filter(c => c.product === p.id);
  const optNames = Object.keys(p.options);
  const sel = {}; optNames.forEach(n => sel[n] = p.options[n][0]);
  // Pick the first in-stock variant as default
  const firstIn = p.variants.find(v => v.stock > 0); if (firstIn) Object.assign(sel, firstIn.options);
  let qty = 1;

  document.title = `${p.name} | North Shore`;
  document.querySelector("meta[name=description]").content = p.short;
  const ld = document.createElement("script"); ld.type = "application/ld+json";
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "Product", name: p.name, description: p.description, brand: { "@type": "Brand", name: "North Shore" }, sku: p.variants[0].sku,
    offers: { "@type": "AggregateOffer", priceCurrency: "GBP", lowPrice: Math.min(...p.variants.map(v => v.price)), highPrice: Math.max(...p.variants.map(v => v.price)), offerCount: p.variants.length, availability: "https://schema.org/InStock" } });
  document.head.appendChild(ld);

  function variant() { return p.variants.find(v => optNames.every(n => v.options[n] === sel[n])); }
  function available(n, val) { return p.variants.some(v => v.options[n] === val && optNames.every(m => m === n || v.options[m] === sel[m]) && v.stock > 0); }

  function render() {
    const v = variant();
    const stock = v ? v.stock : 0;
    const stockCls = stock === 0 ? "out" : stock <= 5 ? "low" : "";
    const stockTxt = stock === 0 ? "Out of stock" : stock <= 5 ? `Only ${stock} left` : "In stock";
    root.innerHTML = `
      <div class="product__gallery">
        <div class="product__main">${Cart.tile(p)}</div>
        <div class="product__thumbs" role="tablist" aria-label="Product images">
          <button role="tab" aria-selected="true" aria-label="Image 1">${Cart.tile(p)}</button>
        </div>
      </div>
      <div>
        <div class="crumbs"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <a href="shop.html?category=${encodeURIComponent(p.category)}">${p.category}</a></div>
        <div class="pill-row" style="margin-bottom:10px">${p.badges.map(b => `<span class="badge ${b === "Batch tested" ? "badge--success" : b === "New" ? "badge--accent" : ""}">${b}</span>`).join("")}</div>
        <h1 class="product__title">${p.name}</h1>
        <div class="muted">${p.category} · SKU ${v ? v.sku : "—"}</div>
        <div class="product__price">${v ? Cart.money(v.price) : "—"}${v && v.wasPrice ? `<span class="price--was">${Cart.money(v.wasPrice)}</span>` : ""}<small>inc. VAT</small></div>
        <div class="product__stock ${stockCls}">${stockTxt}</div>
        <p>${p.description}</p>

        ${optNames.map(n => `
          <div class="opt">
            <div class="opt__label">${n} <span>${sel[n]}</span></div>
            <div class="opt__list" role="group" aria-label="${n}">
              ${p.options[n].map(val => `<button type="button" class="opt__btn" data-opt="${n}" data-val="${val}" aria-pressed="${sel[n] === val}" ${available(n, val) ? "" : "disabled"}>${val}</button>`).join("")}
            </div>
          </div>`).join("")}

        <div class="buy-row">
          <div class="qty" aria-label="Quantity">
            <button type="button" id="dec" aria-label="Decrease quantity">−</button>
            <input type="number" id="qty" min="1" max="${Math.max(1, stock)}" value="${qty}" aria-label="Quantity">
            <button type="button" id="inc" aria-label="Increase quantity">+</button>
          </div>
          <button class="btn btn--primary btn--lg" id="add" ${stock === 0 ? "disabled" : ""}>${stock === 0 ? "Sold out" : "Add to basket"}</button>
        </div>
        <button class="btn btn--accent btn--block btn--lg" id="buynow" ${stock === 0 ? "disabled" : ""}>Buy now</button>

        <div class="product__perks">
          <div>${I.truck} Free UK delivery over ${Cart.money(SITE.shipping.freeThreshold)}</div>
          <div>${I.pin} Free collection from the gym</div>
          <div>${I.return} ${SITE.promises.returns}</div>
          <div>${I.check} ${SITE.promises.dispatch}</div>
        </div>

        <div class="tabs">
          <details open><summary>Key features</summary><div class="tabs__body"><ul>${p.features.map(f => `<li>${f}</li>`).join("")}</ul></div></details>
          ${p.nutrition.length ? `<details><summary>Nutrition per serving</summary><div class="tabs__body"><table class="nutrition"><tbody>${p.nutrition.map(([k, val]) => `<tr><th>${k}</th><td>${val}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
          ${p.ingredients ? `<details><summary>Ingredients & allergens</summary><div class="tabs__body"><p>${p.ingredients}</p><p><strong>Allergens:</strong> ${p.allergens}</p><p class="note">Allergens are shown in <b>bold</b>. Always check the label on the product you receive.</p></div></details>` : ""}
          ${coas.length ? `<details><summary>Batch certificates (${coas.length})</summary><div class="tabs__body"><ul class="batch-list">${coas.map(c => `<li><a href="coa.html?batch=${c.batch}"><u>Batch ${c.batch}</u></a><span class="muted"> · tested ${new Date(c.tested).toLocaleDateString("en-GB", { month: "short", year: "numeric" })}${c.sample ? " · sample" : ""}</span></li>`).join("")}</ul><p class="note">Match the batch number printed on your pack.</p></div></details>` : ""}
          ${p.directions ? `<details><summary>How to use</summary><div class="tabs__body"><p>${p.directions}</p><p class="note">Food supplements should not be used as a substitute for a varied, balanced diet and a healthy lifestyle.</p></div></details>` : ""}
          <details><summary>Delivery & returns</summary><div class="tabs__body"><p>${SITE.promises.dispatch}.</p><ul>${SITE.shipping.options.map(o => `<li>${o.label}: ${o.eta} — ${o.price === 0 ? "free" : Cart.money(o.price)}${o.id === "standard" ? ` (free over ${Cart.money(SITE.shipping.freeThreshold)})` : ""}</li>`).join("")}</ul><p>${SITE.promises.returns}. <a href="returns.html"><u>Returns policy</u></a>.</p></div></details>
        </div>
      </div>`;
  }

  root.addEventListener("click", e => {
    const ob = e.target.closest("[data-opt]");
    if (ob && !ob.disabled) { sel[ob.dataset.opt] = ob.dataset.val; render(); return; }
    if (e.target.id === "inc") { qty = Math.min(qty + 1, variant()?.stock || 1); render(); }
    if (e.target.id === "dec") { qty = Math.max(1, qty - 1); render(); }
    if (e.target.id === "add" || e.target.id === "buynow") {
      const v = variant(); if (!v) return;
      if (Cart.add(p.id, v.sku, qty)) {
        if (e.target.id === "buynow") location.href = "checkout.html";
        else { UI.toast(`${p.name} added to basket`, "success"); UI.open("cart"); }
      }
    }
  });
  root.addEventListener("change", e => { if (e.target.id === "qty") { qty = Math.max(1, parseInt(e.target.value || "1", 10)); render(); } });
  render();

  const rel = PRODUCTS.filter(x => x.id !== p.id).sort((a, b) => (b.category === p.category) - (a.category === p.category)).slice(0, 4);
  document.getElementById("related").innerHTML = rel.map(UI.productCard).join("");
});
</script>
</body>
</html>
